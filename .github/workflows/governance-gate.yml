# Deployment gates for the model registry.
# One "gate (<model>)" check per registered model: a model deploys only if its
# check passes. Make these checks required in branch protection to block merges.
name: governance-gate

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash   # bash -eo pipefail, so a failing gate is not hidden by `tee`

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # lineage checks look up training commits
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q

  discover:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.ls.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "models=$(ls registry/models | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  gate:
    needs: discover
    name: gate (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.discover.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev --python 3.12
      - name: Risk, documentation, lineage, fairness and approval gates
        run: uv run python -m governance.gate "${{ matrix.model }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Runs only when every gate above passed.
      - name: Deploy (simulated release)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.model }}
          path: registry/models/${{ matrix.model }}/
