[project]
name = "ai-governance-registry"
version = "0.1.0"
description = "Model/dataset card registry with EU AI Act risk tiers and CI deployment gates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=4.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "fairlearn>=0.12",
    "folktables>=0.0.12",
    "pyyaml>=6",
    "jsonschema>=4.22",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6", "nbconvert>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
